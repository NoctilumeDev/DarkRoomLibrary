# 服务配置
server:
  port: 20606
  servlet:
    context-path: /api/dark-room-library/v1
    encoding:
      charset: UTF-8
      force: true
# API 地址前缀，用于接口拦截放行和文件访问地址生成
app:
  api-prefix: /api/dark-room-library/v1

# MySQL 与文件上传限制配置
spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # Local development defaults; override DB_URL/DB_USERNAME/DB_PASSWORD in production.
    url: ${DB_URL:jdbc:mysql://localhost:3306/dark_room_library?characterEncoding=UTF-8&useSSL=false&serverTimezone=GMT%2B8&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    hikari:
      transaction-isolation: TRANSACTION_REPEATABLE_READ
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: ${REDIS_TIMEOUT:500ms}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    connection-timeout: ${RABBITMQ_CONNECTION_TIMEOUT:1000ms}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        auto-startup: ${middleware.rabbit.enabled:${RABBITMQ_ENABLED:false}}
      direct:
        auto-startup: ${middleware.rabbit.enabled:${RABBITMQ_ENABLED:false}}
  # 邮件配置
  mail:
    host: ${MAIL_HOST:smtp.qq.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          connectiontimeout: ${MAIL_CONNECTION_TIMEOUT_MS:5000}
          timeout: ${MAIL_READ_TIMEOUT_MS:5000}
          writetimeout: ${MAIL_WRITE_TIMEOUT_MS:5000}
          starttls:
            enable: true

# 让 MyBatis-Plus 在 Mapper目录下找到 XML 映射文件
mybatis-plus:
  mapper-locations: classpath:mapper/*.xml

# JWT 配置
jwt:
  # Local development default; override JWT_SECRET in production.
  secret: ${JWT_SECRET:dark-room-library-dev-jwt-secret-key-please-change-in-production}
  expiration: ${JWT_EXPIRATION:604800000}

# 登录安全配置
security:
  login:
    max-fail-attempts: 5
    lock-duration-minutes: 30
  client-ip:
    # Forwarded headers are accepted only when the direct peer matches this CIDR allowlist.
    trust-forwarded-headers: ${TRUST_FORWARDED_HEADERS:false}
    trusted-proxy-cidrs: ${TRUSTED_PROXY_CIDRS:}
  rate-limit:
    ingress-max-per-minute: ${RATE_LIMIT_INGRESS_MAX_PER_MINUTE:1200}
    public-file-max-per-minute: ${RATE_LIMIT_PUBLIC_FILE_MAX_PER_MINUTE:600}
    anonymous-max-per-minute: ${RATE_LIMIT_ANONYMOUS_MAX_PER_MINUTE:60}
    authenticated-max-per-minute: ${RATE_LIMIT_AUTHENTICATED_MAX_PER_MINUTE:300}
  sensitive-rate-limit:
    login-capacity: ${RATE_LIMIT_LOGIN_CAPACITY:60}
    account-capacity: ${RATE_LIMIT_ACCOUNT_CAPACITY:12}
    verification-capacity: ${RATE_LIMIT_VERIFICATION_CAPACITY:6}
    captcha-capacity: ${RATE_LIMIT_CAPTCHA_CAPACITY:90}

verification-code:
  daily-max-per-email: ${VERIFICATION_CODE_DAILY_MAX_PER_EMAIL:10}

notification:
  max-retry-count: ${NOTIFICATION_MAX_RETRY_COUNT:8}
  alert:
    webhook-url: ${NOTIFICATION_ALERT_WEBHOOK_URL:}
    webhook-token: ${NOTIFICATION_ALERT_WEBHOOK_TOKEN:}
    timeout-ms: ${NOTIFICATION_ALERT_TIMEOUT_MS:3000}

# 借阅配置
borrow:
  max-count: 5
  fine-per-day: 0.5
  fine-max: 100
  renew:
    max-count: 1
    window-days-before-due: 3
    extend-days: 30

reservation:
  max-count: 3
  reconcile-delay-ms: ${RESERVATION_RECONCILE_DELAY_MS:60000}

# CORS配置
cors:
  allowed-origins: ${CORS_ORIGINS:http://localhost:5175}

# 文件上传路径
file:
  upload-dir: ${FILE_UPLOAD_DIR:./upload/pic}
  temp-retention-hours: ${FILE_TEMP_RETENTION_HOURS:24}
  cleanup-cron: "${FILE_CLEANUP_CRON:0 30 3 * * ?}"

# 可降级中间件开关：关闭时直接使用本地内存/同步/数据库兜底
middleware:
  redis:
    enabled: ${REDIS_ENABLED:false}
    recovery-interval-ms: ${REDIS_RECOVERY_INTERVAL_MS:30000}
  rabbit:
    enabled: ${RABBITMQ_ENABLED:false}
    recovery-interval-ms: ${RABBITMQ_RECOVERY_INTERVAL_MS:30000}
    confirm-timeout-ms: ${RABBITMQ_CONFIRM_TIMEOUT_MS:1000}
    exchange: dark.room.library.events
    notification-task-queue: dark.room.library.notification-task
    book-returned-queue: dark.room.library.book-returned
    notification-routing-key: notification.task
    book-returned-routing-key: book.returned
    dead-letter-exchange: dark.room.library.dead-letter
    notification-dead-letter-queue: dark.room.library.notification-task.dead
    book-returned-dead-letter-queue: dark.room.library.book-returned.dead
    notification-dead-letter-routing-key: dead.notification.task
    book-returned-dead-letter-routing-key: dead.book.returned
