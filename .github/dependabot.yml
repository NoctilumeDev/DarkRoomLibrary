version: 2

updates:
  - package-ecosystem: maven
    directory: /backend/dark-room-library-api
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 0
    commit-message:
      prefix: deps

  - package-ecosystem: npm
    directory: /frontend/dark-room-library-web
    schedule:
      interval: weekly
      day: monday
      time: "09:10"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 0
    commit-message:
      prefix: deps

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:20"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 1
    groups:
      workflow-actions:
        patterns:
          - "*"
    commit-message:
      prefix: deps
