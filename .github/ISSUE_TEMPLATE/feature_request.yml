name: Feature request
description: 提议与现有业务边界一致的改进
title: "feat: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 说明当前用户在什么场景下遇到了什么限制。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 说明期望的交互、业务规则和权限边界。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
  - type: checkboxes
    id: scope
    attributes:
      label: 范围确认
      options:
        - label: 该需求不会要求提交真实凭据或演示账号密码。
          required: true
        - label: 我已说明它为什么适合当前增强型单体，而不是独立平台或微服务。
          required: true
