name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
  merge_group:
    types: [checks_requested]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: Repository boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Check changed whitespace
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git diff --check "$BASE_SHA...HEAD"
          else
            git show --check --format= HEAD
          fi

      - name: Check architecture and release boundaries
        run: |
          node scripts/check-architecture.mjs
          node scripts/check-doc-links.mjs
          node scripts/check-residual-hygiene.mjs
          node scripts/check-release-version.mjs

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      rabbitmq:
        image: rabbitmq:4.3.2
        env:
          RABBITMQ_DEFAULT_VHOST: darkroom-test-ci
          RABBITMQ_DEFAULT_USER: darkroom_ci
          RABBITMQ_DEFAULT_PASS: darkroom-ci-fixture-only
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: backend/dark-room-library-api
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"

      - name: Run Maven tests in a non-business timezone and enforce coverage
        run: mvn -B -ntp -Duser.timezone=Asia/Tokyo clean verify

      - name: Match backend coverage to the public baseline
        run: node ../../scripts/check-backend-coverage.mjs

      - name: Check the old client as a bounded negative control
        run: |
          status=0
          mvn -B -ntp -Duser.timezone=Asia/Tokyo -Drabbit-amqp-client.version=5.25.0 -Ddarkroom.expected-client-version=5.25.0 -Dtest=RabbitClientBoundaryTest -Dtest.report.directory=target/rabbitmq-old-reports -l target/rabbitmq-old.log test || status=$?
          test "$status" -eq 1
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          suite = ET.parse('target/rabbitmq-old-reports/TEST-org.darkroomlibrary.config.RabbitClientBoundaryTest.xml').getroot()
          assert [int(suite.get(k)) for k in ('tests', 'failures', 'errors', 'skipped')] == [7, 5, 0, 0]
          cases = suite.findall('testcase')
          failed = [c.get('name') for c in cases if c.find('failure') is not None]
          assert sum(n.startswith('refusesDeclaredLength') for n in failed) == 2
          assert sum(n.startswith('rejectsDeepTables') for n in failed) == 2
          assert sum(n.startswith('springConnectionRejects') for n in failed) == 1
          assert all(c.get('name').startswith('preservesOrdinary') for c in cases if c.find('failure') is None)
          for c in cases:
              failure = c.find('failure')
              if failure is None:
                  continue
              assert failure.get('type') == 'org.opentest4j.AssertionFailedError'
              message = failure.get('message')
              if c.get('name').startswith('refusesDeclaredLength'):
                  assert message == 'Unexpected exception type thrown, expected: <com.rabbitmq.client.MalformedFrameException> but was: <java.io.EOFException>'
              elif c.get('name').startswith('rejectsDeepTables'):
                  assert message == 'Expected com.rabbitmq.client.MalformedFrameException to be thrown, but nothing was thrown.'
              else:
                  assert message == 'Spring must retain the malformed wire-field cause; root=java.io.EOFException ==> expected: not <null>'
          assert 'RabbitMQ boundary client=5.25.0' in ''.join(n.text or '' for n in suite.iter('system-out'))
          PY

      - name: Verify Spring AMQP against an isolated real broker
        env:
          DARKROOM_MQ_TEST: "1"
          DARKROOM_MQ_TEST_VHOST: darkroom-test-ci
          DARKROOM_MQ_TEST_USER: darkroom_ci
          DARKROOM_MQ_TEST_PASSWORD: darkroom-ci-fixture-only
        run: mvn -B -ntp -Duser.timezone=Asia/Tokyo -Dtest=RabbitSpringLifecycleIT -l target/rabbitmq-live.log test

      - name: Retain backend evidence including failed candidates
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: backend-evidence-${{ github.sha }}-${{ github.run_attempt }}
          retention-days: 90
          if-no-files-found: warn
          path: |
            backend/dark-room-library-api/target/surefire-reports/
            backend/dark-room-library-api/target/site/jacoco/
            backend/dark-room-library-api/target/rabbitmq-live.log
            backend/dark-room-library-api/target/rabbitmq-old.log
            backend/dark-room-library-api/target/rabbitmq-old-reports/

  pages-backend-coverage:
    name: Pages backend coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend/dark-room-library-api
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"

      # Mirror Pages' clean build and default runner timezone without deploying.
      - name: Build backend coverage as Pages does
        run: mvn -B -ntp clean verify

      - name: Match backend coverage to the public baseline
        run: node ../../scripts/check-backend-coverage.mjs

      - name: Retain Pages-parity evidence including failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pages-parity-evidence-${{ github.sha }}-${{ github.run_attempt }}
          retention-days: 90
          if-no-files-found: warn
          path: |
            backend/dark-room-library-api/target/surefire-reports/
            backend/dark-room-library-api/target/site/jacoco/jacoco.xml

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend/dark-room-library-web
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/dark-room-library-web/package-lock.json

      - name: Install dependencies
        run: npm ci --registry=https://registry.npmjs.org

      - name: Run ESLint
        run: npm run lint

      - name: Run unit tests and enforce coverage
        run: npm run test:coverage

      - name: Build production assets
        run: npm run build

      - name: Audit dependencies
        run: npm audit --audit-level=high --registry=https://registry.npmjs.org

  deployment-config:
    name: Deployment configuration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Build container images
        run: docker compose build backend frontend
