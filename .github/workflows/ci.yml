name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
  merge_group:
    types: [checks_requested]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: Repository boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Check changed whitespace
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git diff --check "$BASE_SHA...HEAD"
          else
            git show --check --format= HEAD
          fi

      - name: Check architecture and release boundaries
        run: |
          node scripts/check-architecture.mjs
          node scripts/check-doc-links.mjs
          node scripts/check-release-version.mjs

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend/dark-room-library-api
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"

      - name: Run Maven tests and enforce coverage
        run: mvn -B -ntp clean verify

      - name: Match backend coverage to the public baseline
        run: node ../../scripts/check-backend-coverage.mjs

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend/dark-room-library-web
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/dark-room-library-web/package-lock.json

      - name: Install dependencies
        run: npm ci --registry=https://registry.npmjs.org

      - name: Run ESLint
        run: npm run lint

      - name: Run unit tests and enforce coverage
        run: npm run test:coverage

      - name: Build production assets
        run: npm run build

      - name: Audit dependencies
        run: npm audit --audit-level=high --registry=https://registry.npmjs.org

  deployment-config:
    name: Deployment configuration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Build container images
        run: docker compose build backend frontend
