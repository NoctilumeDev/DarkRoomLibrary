name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build browser demo
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend/dark-room-library-web
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/dark-room-library-web/package-lock.json

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Install dependencies
        run: npm ci --registry=https://registry.npmjs.org

      - name: Build backend coverage report
        working-directory: backend/dark-room-library-api
        run: mvn -B -ntp clean verify

      - name: Match backend coverage to the public baseline
        working-directory: backend/dark-room-library-api
        run: node ../../scripts/check-backend-coverage.mjs

      - name: Build frontend coverage report
        run: npm run test:coverage

      - name: Build browser demo
        run: npm run build:demo

      - name: Add interactive project map
        run: cp ../../docs/library-system-modules.html dist/library-system-modules.html

      - name: Add public coverage reports
        run: |
          mkdir -p dist/coverage/backend dist/coverage/frontend
          cp -R coverage/. dist/coverage/frontend/
          cp -R ../../backend/dark-room-library-api/target/site/jacoco/. dist/coverage/backend/

      - name: Apply the DarkRoomLibrary evidence theme
        run: node ../../scripts/theme-coverage-reports.mjs dist

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: frontend/dark-room-library-web/dist

  deploy:
    name: Deploy browser demo
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 30
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
